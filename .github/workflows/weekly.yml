# Builds the map-feature packs of every country from Overture Maps and publishes them as releases.
# Overture publishes a new release about once a month (usually on a Wednesday); this runs every Thursday and skips a
# week with nothing new. Each continent's packs are a release named <continent>-<yyyymmdd> (eu1, eu2… when one would
# have more than GitHub's 1000 files); the release «index» holds index.json(.gz), the list the app reads. STATUS.md is
# committed after each build: it shows what was built, and the commit keeps this schedule alive (GitHub switches off
# the schedules of repositories with no activity for 60 days).
name: Weekly packs

on:
  schedule:
    - cron: '23 5 * * 4'          # Thursdays at 05:23 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these countries (ISO codes, comma-separated) for a test, e.g. cy,mt. Empty: all.'
        required: false
        default: ''
      force:
        description: 'Build even if this Overture release was built already'
        type: boolean
        default: false

permissions:
  contents: write                 # the releases and the STATUS.md commit
  actions: write                  # switches this schedule back on, should GitHub ever switch it off

concurrency:
  group: weekly-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      week: ${{ steps.plan.outputs.week }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - name: DuckDB
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet duckdb
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          gh release download index --pattern index.json --output previous.json 2>/dev/null || echo '{}' > previous.json
          /tmp/venv/bin/python -I overture.py plan --out plan.json --only "$ONLY" --previous previous.json $FORCE \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.skip != 'true'
        with:
          name: plan
          path: plan.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan
      - name: DuckDB
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet duckdb
      - name: Build the packs
        run: /tmp/venv/bin/python -I overture.py build --plan plan.json --group "${{ matrix.group }}" --out out
      - name: Publish them as releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          for tag in $(python3 -c 'import json; print(" ".join(json.load(open("releases.json"))))'); do
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            python3 -c 'import json, sys; print("\n".join(json.load(open("releases.json"))[sys.argv[1]]))' "$tag" > files.txt
            gh release create "$tag" --latest=false --notes-file "NOTES-$tag.md" --title "Packs $tag"
            xargs -a files.txt -n 100 gh release upload "$tag" --clobber
          done
      # only after the releases are there, so the index never points at packs that were not published
      - uses: actions/upload-artifact@v7
        with:
          name: summaries-${{ matrix.group }}
          path: out/*.json
          retention-days: 7

  index:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      WEEK: ${{ needs.plan.outputs.week }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan
      - uses: actions/download-artifact@v8
        continue-on-error: true   # no summaries at all if every group failed: the index keeps the packs it had
        with:
          pattern: summaries-*
          path: summaries
          merge-multiple: true
      - name: The index the app reads
        run: |
          mkdir -p summaries && rm -f summaries/releases.json
          gh release download index --pattern index.json --output previous.json 2>/dev/null || echo '{}' > previous.json
          python3 -I build_all.py index --plan plan.json --summaries summaries --repo "$GITHUB_REPOSITORY" \
            --week "$WEEK" --previous previous.json --out index.json --status STATUS.md
          gh release view index >/dev/null 2>&1 || gh release create index --latest --title "Index of the packs" \
            --notes "The app reads index.json.gz. Map data © OpenStreetMap contributors, Overture Maps Foundation; ODbL 1.0."
          gh release upload index index.json index.json.gz --clobber
      - name: Remove the releases no longer needed
        run: |
          gh release list --limit 1000 --json tagName > releases.json
          for t in $(python3 -I build_all.py cleanup --index index.json --releases releases.json --keep 2); do
            gh release delete "$t" --cleanup-tag --yes
          done
      - name: Status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "Packs of the week of $WEEK" || echo "STATUS.md has not changed"
          git push
          gh workflow enable weekly.yml || true
